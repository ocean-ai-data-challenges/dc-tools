[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dctools-core"
version = "0.1.0"
description = "Low-level, dependency-light ocean data access shared by dctools (data challenges) and oceanml3d-eval."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
authors = [{ name = "Kamel Ait Mohand" }]
keywords = ["xarray", "zarr", "s3", "altimetry", "argo", "ocean"]
# Deliberately no dask.distributed, torch, oceanbench, loguru: this package must be importable from
# an evaluation environment that has none of them. Anything heavier goes in an extra.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "fsspec>=2023.1",
    "zarr>=2.14,<3",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
s3 = ["s3fs>=2023.1"]
h5 = ["h5netcdf>=1.0"]
argo = ["argopy>=1.1", "kerchunk>=0.2", "zstandard>=0.21", "ujson>=5", "requests>=2.28"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["dctools_core*"]

[tool.ruff]
line-length = 100
